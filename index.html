<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move well">
<title>Move well</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F1F7; --card:#FFFFFF; --ink:#16141C; --muted:#6D6A78; --line:#E9E6F1;
  --pink:#F7CBE8; --lilac:#DAD6F7; --sky:#D2E8F6; --lime:#DDF59A; --mint:#D3F0CF; --peach:#F9E3C9;
  --blue:#3A5BF0; --btn:#16141C; --btnInk:#FFFFFF; --soft:rgba(255,255,255,.72); --shadow:0 6px 20px rgba(40,30,80,.07);
  --u-cream:#F1E6D8; --u-pink:#F5B8CF; --u-rose:#D9638F; --u-pist:#D5E5A8; --u-green:#284A33;
  --tabh:62px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --bg:#141219; --card:#211E28; --ink:#F2F0F7; --muted:#A9A5B6; --line:#332F3D;
    --pink:#53304A; --lilac:#38345E; --sky:#2A4152; --lime:#3F4D1E; --mint:#2B4832; --peach:#4F3E29;
    --blue:#8EA2FF; --btn:#F2F0F7; --btnInk:#141219; --soft:rgba(255,255,255,.08); --shadow:0 6px 20px rgba(0,0,0,.35);
    --u-cream:#2C2620; --u-pink:#5C3346; --u-rose:#F08DB4; --u-pist:#3B4A22; --u-green:#B9DCA6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#141219; --card:#211E28; --ink:#F2F0F7; --muted:#A9A5B6; --line:#332F3D;
  --pink:#53304A; --lilac:#38345E; --sky:#2A4152; --lime:#3F4D1E; --mint:#2B4832; --peach:#4F3E29;
  --blue:#8EA2FF; --btn:#F2F0F7; --btnInk:#141219; --soft:rgba(255,255,255,.08); --shadow:0 6px 20px rgba(0,0,0,.35);
  --u-cream:#2C2620; --u-pink:#5C3346; --u-rose:#F08DB4; --u-pist:#3B4A22; --u-green:#B9DCA6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(214,180,240,.35),transparent 60%),var(--bg);color:var(--ink);font-family:'Urbanist','Helvetica Neue',Arial,sans-serif;line-height:1.4;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(var(--tabh) + 40px)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 8px}
.back{font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:8px 0}
.logo{display:flex;align-items:baseline;gap:6px;text-decoration:none}
.logo b{font-weight:700;font-size:30px;line-height:.9;color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.logo i{font-style:normal;font-weight:800;font-size:30px;line-height:.9;color:var(--blue)}
.gear{border:0;background:var(--card);border-radius:999px;width:40px;height:40px;box-shadow:var(--shadow);font-size:18px}
h1{font-size:clamp(24px,7vw,30px);font-weight:800;margin:4px 0 2px}
h2{font-size:19px;font-weight:800;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);position:relative}
.tint{border-radius:24px;padding:16px;position:relative}
.c-pink{background:var(--pink)}.c-lilac{background:var(--lilac)}.c-sky{background:var(--sky)}.c-lime{background:var(--lime)}.c-mint{background:var(--mint)}.c-peach{background:var(--peach)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.big{font-size:clamp(24px,7vw,30px);font-weight:800;line-height:1.08;margin:4px 0 4px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:15px;background:var(--btn);color:var(--btnInk)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button.chip{border:0}
button.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{font-size:11.5px;color:var(--muted);font-weight:700}
.week .n{width:38px;height:38px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.week .done{background:var(--btn);color:var(--btnInk)}
.week .plan{box-shadow:inset 0 0 0 2px #CFCBDD}
.week .today{box-shadow:inset 0 0 0 2.5px var(--blue);color:var(--blue)}
.week .run{background:var(--lime)}
.week .flow{background:var(--u-pink)}
.week .dots{height:8px;font-size:9px;line-height:8px;color:var(--muted)}
/* items */
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px}
.item b{display:block;font-size:16px}
.item span.s{font-size:13px;color:var(--muted)}
.tick{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:inset 0 0 0 2px #CFCBDD;font-weight:800}
.tick[aria-pressed="true"]{background:var(--btn);color:var(--btnInk);box-shadow:none}
.prog{height:10px;border-radius:999px;background:rgba(22,20,28,.1);overflow:hidden}
.prog i{display:block;height:100%;background:var(--btn);border-radius:999px}
.tile{border:0;text-align:left;border-radius:22px;padding:14px;min-height:112px;display:flex;flex-direction:column;gap:3px;position:relative}
.tile .e{font-size:26px;line-height:1}
.tile b{font-size:16px;margin-top:6px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .badge{position:absolute;right:10px;top:10px;background:var(--btn);color:var(--btnInk);font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--muted)}
.link{color:var(--blue);font-weight:700;text-decoration:none}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);box-shadow:0 -6px 20px rgba(40,30,80,.08);padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:800;color:var(--muted)}
nav.tabs button span{font-size:20px;line-height:1.1}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--sky)}
/* sheets and player */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(20,18,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sheet .head h3{margin:0;font-size:20px;font-weight:800}
.x{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow)}
label.l{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 6px}
input.f,select.f,textarea.f{width:100%;border:0;border-radius:14px;background:var(--card);padding:12px 14px;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.player{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.player .in{max-width:640px;margin:0 auto}
.player .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.player .pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0}
.player .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--blue))}
.now{border-radius:26px;padding:18px;background:var(--pink)}
.now .name{font-size:clamp(26px,8vw,34px);font-weight:800;line-height:1.05;margin:6px 0 2px}
.clock{font-size:clamp(54px,18vw,80px);font-weight:800;line-height:1;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center;margin-top:12px}
.setrow input{width:100%;border:0;border-radius:14px;background:var(--card);padding:12px;font-size:18px;font-weight:800;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.setrow small{display:block;font-size:11.5px;color:var(--muted);text-align:center;font-weight:700}
.rest{background:var(--btn);color:var(--btnInk);border-radius:26px;padding:18px;text-align:center}
.suggest{background:var(--soft);border-radius:16px;padding:10px 12px;font-size:14px;margin-top:10px}
/* cycle (Unna colours) */
.cyc{background:var(--u-pist);color:var(--u-green);border-radius:26px;padding:18px;font-family:'Outfit',sans-serif;position:relative;overflow:hidden}
.cyc .mark{position:absolute;right:14px;top:12px;font-weight:700;font-size:40px;line-height:.85;color:var(--u-rose);text-align:center;opacity:.85}
.cbtn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--u-green);color:var(--u-cream)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:700}
.cal .c{width:36px;height:36px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700}
.cal .p{background:var(--u-rose);color:#fff}.cal .pr{box-shadow:inset 0 0 0 2px var(--u-rose);color:var(--u-rose)}.cal .fw{background:var(--u-pist);color:var(--u-green)}.cal .t{outline:2.5px solid var(--u-green);outline-offset:1px}
.petals{display:flex;justify-content:space-between;gap:4px;margin:0 0 12px;color:var(--u-green)}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:10px}
.banner{background:var(--peach);border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gate{min-height:70vh;display:grid;place-items:center;text-align:center}

/* muscle maps */
.mm{display:flex;gap:12px;align-items:center;margin:10px 0 4px}
.mm svg{flex:none}
.mm-l{margin:0;font-size:13.5px;line-height:1.35}
.mm-l span{color:var(--muted)}
.mm-float{float:right;margin:-6px -6px 0 6px}
.mm-float .mm{margin:0}
/* ===== Dark and lime look (Nathan) ===== */
:root[data-look="dark"]{color-scheme:dark;--bg:#0B0C0B;--card:#171917;--ink:#F3F5EF;--muted:#9BA196;--line:#2A2E29;
  --pink:#171917;--lilac:#171917;--sky:#171917;--mint:#171917;--peach:#171917;--lime:#C8F35C;--blue:#C8F35C;
  --btn:#C8F35C;--btnInk:#0B0C0B;--soft:rgba(255,255,255,.08);--shadow:none}
:root[data-look="dark"] body{background:var(--bg)}
:root[data-look="dark"] .tint,:root[data-look="dark"] .card,:root[data-look="dark"] .now{border:1px solid #262A25}
:root[data-look="dark"] .tint:not(.c-lime):not(.hero) .kicker,:root[data-look="dark"] .now .kicker{color:var(--lime)}
:root[data-look="dark"] .c-lime{background:#C8F35C;color:#0B0C0B;border-color:#C8F35C}
:root[data-look="dark"] .c-lime .muted,:root[data-look="dark"] .c-lime .note,:root[data-look="dark"] .c-lime .s{color:#33410F}
:root[data-look="dark"] .c-lime .btn{background:#0B0C0B;color:#C8F35C}
:root[data-look="dark"] .c-lime .btn.soft,:root[data-look="dark"] .c-lime .chip{background:rgba(0,0,0,.12);color:#0B0C0B}
:root[data-look="dark"] .c-lime .prog{background:rgba(0,0,0,.15)} :root[data-look="dark"] .c-lime .prog i{background:#0B0C0B}
:root[data-look="dark"] .hero{background:linear-gradient(135deg,#8DB83A 0%,#3E5E1A 58%,#1B280D 100%);color:#fff;border:0}
:root[data-look="dark"] .hero .muted{color:#E3EDD0} :root[data-look="dark"] .hero .kicker{color:#fff}
:root[data-look="dark"] .hero .btn{background:#0B0C0B;color:#fff} :root[data-look="dark"] .hero .btn.soft,:root[data-look="dark"] .hero .chip{background:rgba(0,0,0,.28);color:#fff}
:root[data-look="dark"] nav.tabs{background:#141614;box-shadow:none;border-top:1px solid #222621}
:root[data-look="dark"] nav.tabs button[aria-current="page"]{background:var(--lime);color:#0B0C0B}
:root[data-look="dark"] .week .run{color:#0B0C0B}
:root[data-look="dark"] .rest{background:#171917;color:var(--ink);border:1px solid #2A2E29}
:root[data-look="dark"] .rest .clock{color:var(--lime)}
:root[data-look="dark"] .rest .btn.soft{background:rgba(255,255,255,.08)}
:root[data-look="dark"] .player .pbar i{background:linear-gradient(90deg,#5E7A2A,#C8F35C)}
:root[data-look="dark"] .tile{border:1px solid #262A25}
:root[data-look="dark"] .tile.c-lime{border-color:#C8F35C}
:root[data-look="dark"] .tile.c-lime span{color:#33410F}
:root[data-look="dark"] .gear{background:#171917}
:root[data-look="dark"] .item .ic{background:#222621}
:root[data-look="dark"] .item .ic.c-lime{background:#C8F35C;color:#0B0C0B}
</style>
</head>
<body>
<main id="main">
  <header class="top">
    <a class="back" href="/" aria-label="Back to the family dashboard">← Dashboard</a>
    <a class="logo" href="#today" aria-label="Move well home"><b>move</b><i>well</i></a>
    <button class="gear" id="openSettings" type="button" aria-label="Settings">⚙︎</button>
  </header>

  <div id="gate" class="gate" hidden>
    <div><p class="big">Hi! 👋</p><p class="muted">Sign in to keep your workouts, weights and cycle private to you.</p>
    <button class="btn" id="signin" type="button">Sign in with Google</button><p class="note" id="gatemsg"></p></div>
  </div>

  <section id="v-today" hidden></section>
  <section id="v-programs" hidden></section>
  <section id="v-run" hidden></section>
  <section id="v-stretch" hidden></section>
  <section id="v-cycle" hidden></section>
  <section id="v-progress" hidden></section>
</main>

<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="in">
  <button type="button" data-go="today"><span>🏠</span>Today</button>
  <button type="button" data-go="programs"><span>📚</span>Programs</button>
  <button type="button" data-go="run"><span>🏃‍♀️</span>Run</button>
  <button type="button" data-go="stretch"><span>🌿</span>Stretch</button>
  <button type="button" data-go="cycle"><span>🌸</span>Cycle</button>
  <button type="button" data-go="progress"><span>📈</span>Progress</button>
</div></nav>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel"><div class="head"><h3 id="sheetTitle"></h3><button class="x" type="button" data-close>Close</button></div><div id="sheetBody"></div></div>
</div>
<div id="player" class="player" hidden role="dialog" aria-modal="true" aria-label="Workout"></div>

<script src="/firebase-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
